kotlin.code.style=official

# ===== GitHub Packages 托管发布配置 =====
# 发布版本号（CI 打 tag 时可通过 -PNAV_ROUTER_VERSION=${GITHUB_REF_NAME} 覆盖）
NAV_ROUTER_VERSION=1.0.0
# GitHub Packages 仓库地址，格式：https://maven.pkg.github.com/<OWNER>/<REPO>
# OWNER = GitHub 用户名或组织名，REPO = 仓库名（需替换为实际值）
GITHUB_MAVEN_URL=https://maven.pkg.github.com/dalingge/nav3-router
