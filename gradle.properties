kotlin.code.style=official

# ===== GitLab Maven 托管发布配置 =====
# 发布版本号（CI 打 tag 时可通过 -PNAV_ROUTER_VERSION=$CI_COMMIT_TAG 覆盖）
NAV_ROUTER_VERSION=1.0.0
# GitLab Maven 仓库地址，格式：https://<host>/api/v4/projects/<project_id>/packages/maven
# project_id 使用 URL 编码的完整路径（路径中的 / 编码为 %2F），也可直接填数字项目 ID
GITLAB_MAVEN_URL=http://gitlab.yqkj.group/api/v4/projects/310/packages/maven
