// publish.gradle —— GitHub Packages 托管发布共享脚本
// 由需要发布的框架模块（nav-annotation / nav-runtime / nav-compiler）在 plugins 块之后 apply，
// 确保本脚本的 afterEvaluate 晚于 AGP 注册，从而能访问 components["release"] / components["java"]。
apply plugin: 'maven-publish'

afterEvaluate {
    def moduleName = project.name
    // JVM 模块发布 java 组件；Android 库发布 release 组件（需配合 singleVariant("release")）
    def componentName = (moduleName == 'nav-runtime') ? 'release' : 'java'

    publishing {
        repositories {
            maven {
                name = 'GitHub'
                url = project.findProperty('GITHUB_MAVEN_URL') ?: ''
                credentials {
                    // CI(GitHub Actions) 用 GITHUB_TOKEN；本地用 GitHub 用户名 + PAT
                    def isCi = System.getenv('CI') == 'true'
                    username = isCi ? (System.getenv('GITHUB_ACTOR') ?: 'github-actions') : project.findProperty('GITHUB_USER') ?: ''
                    password = isCi ? System.getenv('GITHUB_TOKEN') : project.findProperty('GITHUB_TOKEN') ?: ''
                }
            }
        }
        publications {
            maven(MavenPublication) {
                from components[componentName]
                groupId = 'com.yiqun.nav'
                artifactId = moduleName
                // GitHub Packages 不支持 SNAPSHOT 版本，必须是 release 版本
                version = project.findProperty('NAV_ROUTER_VERSION') ?: '0.0.1'
            }
        }
    }
}
